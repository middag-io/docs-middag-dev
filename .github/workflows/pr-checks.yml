name: PR checks

# Checks every pull request. The production deploy is deploy.yml.
#
# - format: Prettier, no dependency install, so it also runs on fork PRs.
# - site: npm ci, unit tests and the full Nimbus build (scripts/build-site.mjs),
#   which fails on any preset warning, a home page not built from
#   docs/index.md, a /index/ route, a missing search index, a broken internal
#   link or anchor, or a live-sitemap URL with no page or redirect. It installs
#   internal @middag-io packages, so it runs only for branches of this
#   repository, never for forks.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Same version as the lockfile; installed alone so no internal package
      # is read.
      - name: Prettier
        run: npx --yes prettier@3.9.6 --check .

  site:
    # Same-repository branches only: forks never receive the internal packages.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # GITHUB_TOKEN reads the @middag-io packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The committed .npmrc maps @middag-io to GitHub Packages and reads the
      # token from ${NODE_AUTH_TOKEN}.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      # Fetches the injected channels from the public docs proxy, assembles
      # site-content/, builds with the preset in strict mode and checks dist/.
      - name: Build Nimbus site
        run: npm run site:build
