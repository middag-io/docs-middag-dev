name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    # Deploy only when the site can change: a push whose every path is in this
    # list (license, agent instructions, repository metadata, local tooling
    # config) is skipped. Any other path, README.md and this workflow included,
    # deploys. workflow_dispatch is not filtered.
    paths-ignore:
      - "LICENSE*"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/**"
      - ".github/*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".env.local.tpl"
      - ".prettierrc.json"
      - ".prettierignore"
  workflow_dispatch:

# One production deploy per ref at a time; a newer push waits for the
# in-flight run instead of cancelling it, so a deploy never stops half done.
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # GITHUB_TOKEN reads the @middag-io packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # The committed .npmrc maps the @middag-io scope to GitHub Packages and
      # reads the token from ${NODE_AUTH_TOKEN}.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      # Unit tests and the publish guard that refuses decisions/, internal/,
      # adr/ and madr/ paths.
      - name: Test
        run: npm test

      # Fetches the injected channels from the public docs proxy, assembles
      # site-content/, builds with the Nimbus preset in strict mode and checks
      # dist/ (links, anchors, redirects, sitemap mapping).
      - name: Build
        run: npm run site:build

      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The deploy token is read only in this job, under the production
    # environment (deployments limited to main).
    environment:
      name: production
      url: https://docs.middag.dev
    steps:
      # No checkout and no npm install in the job that holds the deploy token.
      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: "4.158.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=docs-middag-dev --branch=main
