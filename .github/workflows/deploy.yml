name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    # Deploy only when the site can change: a push whose every path is in this
    # list (license, agent instructions, repository metadata, local tooling
    # config) is skipped. Any other path, README.md and this workflow included,
    # deploys. workflow_dispatch is not filtered.
    paths-ignore:
      - "LICENSE*"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/**"
      - ".github/*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".env.local.tpl"
      - ".prettierrc.json"
      - ".prettierignore"
  workflow_dispatch:

# One production deploy per ref at a time; a newer push waits for the
# in-flight run instead of cancelling it, so a deploy never stops half done.
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read # checkout
  packages: read # GITHUB_TOKEN fallback for reading @middag-io packages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # The committed .npmrc maps the @middag-io scope to GitHub Packages and
      # reads the token from ${NODE_AUTH_TOKEN}. Prefer a PAT with read:packages
      # (secret NODE_AUTH_TOKEN); fall back to the repo GITHUB_TOKEN, which works
      # only if those packages grant this repo access.
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      # Unit tests and an end-to-end prebuild run against a local fake proxy,
      # including the publish guard that refuses decisions/, internal/, adr/
      # and madr/ paths (docs-middag-ops#66).
      - name: Test
        run: npm test

      # docs:prebuild pulls library docs from the PUBLIC docs proxy anonymously,
      # then VitePress builds into docs/.vitepress/dist — no DOCS_PROXY_TOKEN needed.
      - name: Build
        run: npm run docs:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=docs-middag-dev --branch=main
